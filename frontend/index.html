<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AASIST | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>AASIST</h1>

            <p class="subtitle">Welcome back</p>

            <!-- LOGIN -->

            <form id="loginForm">

                <div class="input-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>


            <!-- SIGNUP -->

            <div class="signup-section">

                <p>Don't have an account?</p>

                <button
                    type="button"
                    id="showSignup"
                    class="secondary-btn"
                >
                    Create Account
                </button>

            </div>


            <!-- SIGNUP FORM -->

            <form id="signupForm" class="hidden">

                <h2>Create Account</h2>

                <div class="input-group">
                    <label>Name</label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Minimum 6 characters"
                        required
                    >
                </div>

                <button type="submit">
                    Sign Up
                </button>

                <p id="signupMessage"></p>

                <button
                    type="button"
                    id="showLogin"
                    class="secondary-btn"
                >
                    Back to Login
                </button>

            </form>

        </div>

    </div>

    <script src="script.js" defer></script>

</body>
</html>
